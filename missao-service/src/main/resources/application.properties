# essa linha precisa ter o conteúdo do ISSUER no código do AuthResource, no caso "users"
mp.jwt.verify.issuer=users
# essa linha mostra onde está a public key
mp.jwt.verify.publickey.location=publicKey.pem
# desabilita o contêiner do Keycloak (como não estou utilizando um serviço de openId oficial)
quarkus.keycloak.devservices.enabled=false


#porta https escolhida para o serviço
quarkus.http.ssl-port=8443
#localização do arquivo do arquivo com a chave-privada e certificado auto-assinado
quarkus.http.ssl.certificate.key-store-file=keystore.jks
#senha atualizada do keystore.jks
quarkus.http.ssl.certificate.key-store-password=maycke

#desabilita requisições http (força https)
quarkus.http.insecure-requests=disabled

#para o cliente confir no certificado não homologado por uma unidade certificadora do StatusPersonagemService
quarkus.tls.trust-all=true
