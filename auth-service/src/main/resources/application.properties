#usado antes de implementar o https
#quarkus.http.port=8082
#desabilita requisições http (força https)
quarkus.http.insecure-requests=disabled

smallrye.jwt.sign.key.location=privateKey.pem

#porta https escolhida para o serviço
quarkus.http.ssl-port=8445
#localização do arquivo do arquivo com a chave-privada e certificado auto-assinado
quarkus.http.ssl.certificate.key-store-file=keystore.jks
#senha atualizada do keystore.jks
quarkus.http.ssl.certificate.key-store-password=maycke

